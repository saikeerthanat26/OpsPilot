name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m evals.run_evals
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: opspilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPSPILOT_TEST_POSTGRES_URL: postgresql://opspilot:ci-only-password@localhost:5432/opspilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_postgres.py
