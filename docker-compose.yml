services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${OPSPILOT_DB_PASSWORD:?Set OPSPILOT_DB_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  opspilot:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OPSPILOT_DATABASE_URL: postgresql://opspilot:${OPSPILOT_DB_PASSWORD}@postgres:5432/opspilot
      OPSPILOT_API_IDENTITIES: ${OPSPILOT_API_IDENTITIES:?Configure bearer identities as shown in README}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  postgres-data:
