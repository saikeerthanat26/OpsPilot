[project]
name = "opspilot"
version = "0.7.0"
description = "Governed Agentic SRE control plane reference implementation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "langgraph>=1,<2", "mcp>=1.26,<2", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4", "kubernetes>=32,<36", "boto3>=1.35,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
